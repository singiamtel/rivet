sync_coverage:
  stage: deploy
  before_script:
    - git config --global user.name "RivetCheck (CI-bot)"
    - git config --global user.email "rivet-support@cern.ch"
  script:
    - echo "Syncing coverage reference"
    - ref_diff=$(git diff test/coverage/coverage.json)
    - echo $ref_diff
    - |
      if [[ ! -z "${ref_diff}" ]]; then
        git add -f test/coverage/coverage.json
        git commit -m "coverage-reference update [skip ci]"
        git push "https://gitlab-ci-token:${CI_PRIVATE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:$CI_COMMIT_REF_NAME
      fi
  needs:
    - job: build_ubuntu_gcc_hepmc3_py3
  rules:
    - if: '($CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_NAME == "main") && $CI_PIPELINE_SOURCE != "schedule"'

announce:
  stage: deploy
  image:
    python:3-alpine
  script:
    - apk add --no-cache curl jq
    - pip install --upgrade pip --root-user-action=ignore
    - pip install --no-cache-dir atproto Mastodon.py --root-user-action=ignore
    - |
      MR_DATA=$(curl --silent --header "PRIVATE-TOKEN: ${CI_PRIVATE_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/commits/${CI_COMMIT_SHA}/merge_requests")
      MR_COUNT=$(echo "$MR_DATA" | jq '[.[] | select(.state=="merged")] | length')
      if [ "$MR_COUNT" -gt 0 ]; then
        # Extract labels from the first matching merge request
        MR_LABELS=$(echo "$MR_DATA" | jq -r '[.[] | select(.state=="merged")][0].labels | join(", ")')
        if [[ "${MR_LABELS}" == *"#tweetme"* ]]; then
          MR_IID=$(echo "$MR_DATA" | jq -r '[.[] | select(.state=="merged")][0].iid')
          export MR_TITLE=$(echo "$MR_DATA" | jq -r '[.[] | select(.state=="merged")][0].title')
          export MR_URL="${CI_PROJECT_URL}/-/merge_requests/${MR_IID}"
          echo "Triggering announcement."
          python ci/post2socials.py
        else
          echo "Required label not found. Skipping announcement."
        fi
      else
        echo "No open merge request found for commit ${CI_COMMIT_SHA}."
      fi
  rules:
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'

