variables:
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SSL_NO_VERIFY: "true"
  DOCKER_DRIVER: overlay2


stages:
- compile
- precheck
- check
- validate
- deploy


.trigger_template: &trigger_template
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "schedule"'
      #changes:
      #- .gitlab*
      #- configure.ac
      #- Makefile.am
      #- "**/Makefile.am"
      #- m4/*
      #- ci/*
      #- bin/*
      #- include/**/*
      #- src/**/*
      #- pyext/**/*
      #- test/*
      when: always
    - when: never


.build_template: &build_template
  image:
    hepstore/hepbase-$ARCH
  stage: compile
  script:
    - shopt -s expand_aliases
    - set -e
    - BUILD_PREFIX="$CI_PROJECT_DIR"
    - MAKE="make -j $(nproc)"
    #/build_$ARCH"
    - mkdir -p $BUILD_PREFIX
    - INSTALL_PREFIX="$CI_PROJECT_DIR/local_$ARCH"
    - mkdir -p $INSTALL_PREFIX
    - TEST_PREFIX="$CI_PROJECT_DIR/test_$ARCH"
    - mkdir -p $TEST_PREFIX
    ## Build the core library
    # - export CPPFLAGS="$CPPFLAGS -DNDEBUG"
    #- export PATH=$INSTALL_PREFIX/bin:$PATH
    - if [[ "x$COVERAGE" != "x" ]]; then apt-get update && apt-get install -y lcov curl; fi
    ## Build YODA
    - git clone --depth 1 --branch main https://gitlab.com/hepcedar/yoda.git yoda/
    - cd yoda/
    - autoreconf -i
    - ./configure --prefix=$INSTALL_PREFIX
    - $MAKE
    - $MAKE install
    - cp yodaenv.sh $INSTALL_PREFIX/
    - cd ..
    ## Build Rivet
    - autoreconf -i
    - cd $BUILD_PREFIX
    - if [[ "$ALLANAS" != "1" ]]; then ANAOPT="--disable-analyses"; fi
    - CONF="./configure --prefix=$INSTALL_PREFIX $ANAOPT --with-yoda=$INSTALL_PREFIX --with-hepmc=/usr/local --with-fastjet=/usr/local $COVERAGE $EXTRA_CONFIGURE_ARGS"
    - if (echo $ARCH | grep -q hepmc3); then CONF=${CONF/with-hepmc/with-hepmc3}; fi
    - echo $CONF
    - $CONF
    - $MAKE RIVET_BUILD_ALLCAT=1
    # - echo @$LD_LIBRARY_PATH@
    - $MAKE check || (cat test/test-suite.log && false)
    - $MAKE install
    - cp rivetenv.sh $INSTALL_PREFIX/
    ## Basic testing
    - echo "LD_LIBRARY_PATH = $LD_LIBRARY_PATH"
    - echo "PYTHONPATH = $PYTHONPATH"
    - python --version
    - ls /etc/profile.d || true
    - root-config --prefix || true
    - cat $INSTALL_PREFIX/yodaenv.sh
    - source $INSTALL_PREFIX/yodaenv.sh
    - cat $INSTALL_PREFIX/rivetenv.sh
    - source $INSTALL_PREFIX/rivetenv.sh
    - rivet -h
    # - |
    #   if [[ "$ALLANAS" != "1" ]]; then
    #     ./ci/getAffectedRoutines.sh anasToCompile.txt
    #     echo "==== echo analyses to compile ====="
    #     cat anasToCompile.txt
    #     find analyses -name MC_TTBAR.cc >> anasToCompile.txt # need at least one!
    #     cat anasToCompile.txt | sort --unique > anasToCompile.tmp ; mv anasToCompile.tmp anasToCompile.txt
    #     echo rivet-build `cat anasToCompile.txt`
    #     RIVET_BUILD_NOCAT=1 rivet-build RivetModifiedAnas.so `cat anasToCompile.txt`
    #     mkdir -p ${CI_PROJECT_DIR}/local${PYTHON_VERSION}/lib/Rivet/.
    #     mkdir -p ${CI_PROJECT_DIR}/local${PYTHON_VERSION}/share/Rivet/.
    #     cp RivetModifiedAnas.so ${CI_PROJECT_DIR}/local${PYTHON_VERSION}/lib/Rivet/.
    #     while read p ; do cp ${p/%.cc}* ${CI_PROJECT_DIR}/local${PYTHON_VERSION}/share/Rivet/. ; done < anasToCompile.txt
    #     rm ${CI_PROJECT_DIR}/local${PYTHON_VERSION}/share/Rivet/*cc
    #   fi
    # - find $CI_PROJECT_DIR
    # - ls $CI_PROJECT_DIR
    - if [[ "x$COVERAGE" != "x" ]]; then lcov --summary ./test/coverage/coverage.info; fi
    - if [[ "x$COVERAGE" != "x" ]]; then MSG=$(./test/coverage/mkreport); fi
    - MR_ID=$(git ls-remote origin | grep "${CI_COMMIT_SHORT_SHA}.*merge-requests" | grep -o "merge-requests/.*" | cut -d "/" -f 2) || true
    - |
      if [[ "x$COVERAGE" != "x" && "x$MR_ID" != "x" ]]; then
        curl --request POST "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/merge_requests/${MR_ID}/notes" \
            --header "PRIVATE-TOKEN: ${CI_PRIVATE_TOKEN}" --header "Content-Type: application/json" \
            --data "{ \"body\": \"${MSG}\" }" --silent -o /dev/null
      fi
  coverage: '/^\s*lines\.+: (\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      # - ${CI_PROJECT_DIR}/local_$ARCH/
      # - ${CI_PROJECT_DIR}/test_$ARCH/
      # - ${CI_PROJECT_DIR}/Make*
      # - ${CI_PROJECT_DIR}/config.log
      - config.log
      - test/
      - local_$ARCH/
      - test_$ARCH/
    expire_in: 36 hrs
  <<: *trigger_template

